<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Divyarajsinh Karmariya — I build useful things</title>
  <desc id="desc">A dark, animated graphic with an orbiting light motif and a software engineering introduction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset=".52" stop-color="#0b1725"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".58" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#45e0d0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#45e0d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .orbit { transform-origin: 828px 140px; animation: orbit 18s linear infinite; }
    .orbit-reverse { transform-origin: 828px 140px; animation: orbit 26s linear infinite reverse; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .line { stroke-dasharray: 85 500; animation: travel 7s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .45; transform: scale(1.04); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes travel { to { stroke-dashoffset: -585; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit-reverse, .pulse, .cursor, .line { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#background)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="818" cy="138" r="195" fill="url(#glow)" class="pulse"/>
    <path d="M0 260H1000" stroke="#5eead4" stroke-opacity=".14"/>
    <path class="line" d="M0 260H1000" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="30" y="28" width="106" height="24" rx="12" fill="#112d35" stroke="#5eead4" stroke-opacity=".42"/>
    <circle cx="46" cy="40" r="3.5" fill="#5eead4"/>
    <text x="58" y="44" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#b8f9ed">OPEN TO BUILD</text>
    <text x="30" y="103" font-family="Arial, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.8" fill="#f6fbff">DIVYARAJSINH</text>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.8" fill="url(#accent)">KARMARIYA</text>
    <text x="32" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#c8d5e3">I build useful things.</text>
    <rect class="cursor" x="201" y="175" width="2" height="19" fill="#5eead4"/>
    <text x="32" y="231" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#91a9bb">SOFTWARE ENGINEERING  /  USF  /  AI + WEB</text>
    <g fill="none" stroke="#80ecde" stroke-opacity=".18">
      <circle cx="828" cy="140" r="100" stroke-width="1.2"/>
      <circle cx="828" cy="140" r="77" stroke-width="1.2" stroke-dasharray="5 8"/>
      <circle cx="828" cy="140" r="53" stroke-width="1.2"/>
    </g>
    <g class="orbit">
      <circle cx="828" cy="40" r="7" fill="#5eead4"/>
      <circle cx="828" cy="40" r="15" fill="#5eead4" fill-opacity=".16"/>
    </g>
    <g class="orbit-reverse">
      <circle cx="905" cy="140" r="4" fill="#a78bfa"/>
      <circle cx="905" cy="140" r="10" fill="#a78bfa" fill-opacity=".2"/>
    </g>
    <circle cx="828" cy="140" r="36" fill="#0d2732" stroke="url(#accent)" stroke-width="2"/>
    <text x="828" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-2" fill="#e5fbf7">DK</text>
    <path d="M717 56l-14 0m7-7v14M945 215l-14 0m7-7v14" stroke="#9eddd8" stroke-opacity=".4" stroke-width="1.2"/>
    <rect x=".5" y=".5" width="999" height="279" rx="17.5" fill="none" stroke="#7198a3" stroke-opacity=".25"/>
  </g>
</svg>
